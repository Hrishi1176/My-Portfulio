<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0728" />
      <stop offset="50%" stop-color="#030014" />
      <stop offset="100%" stop-color="#05132d" />
    </linearGradient>

    <!-- Outer Neon Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Monogram Text Gradient -->
    <linearGradient id="hbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background with Cyberpunk Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />

  <!-- Inner Subtle Accent Border -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#a855f7" stroke-width="3" stroke-opacity="0.4" />

  <!-- Monogram "HB" -->
  <text
    x="256"
    y="332"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
    font-size="236"
    font-weight="900"
    letter-spacing="-14"
    text-anchor="middle"
    fill="url(#hbGrad)"
    filter="url(#neonGlow)"
  >HB</text>

  <!-- Active Quantum Ping / Online Node -->
  <circle cx="396" cy="116" r="28" fill="none" stroke="#00f0ff" stroke-width="4" opacity="0.5" />
  <circle cx="396" cy="116" r="18" fill="#00f0ff" />
</svg>
